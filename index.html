<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Word LLM</title>
    <link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
>
    <style>
        :root {
        --bg: #12171d; --panel: #1a212a; --ink: #e6ebf1; --muted: #8b97a4;
        --line: #2c3541; --accent: #7aa2ff; --accent-ink: #0d1320; --bubble: #232c37;
        color-scheme: dark;
        }
        #log { flex: 1; overflow-y: scroll; display: flex; flex-direction: column; gap: 10px; padding: 4px 2px; max-height: 90%;}
        .msg { max-width: 80%; padding: 8px 14px; border-radius: 14px; word-break: break-word; }
        .me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; font-family: system-ui, sans-serif; }
        .bot { align-self: flex-start; background: var(--bubble); border-bottom-left-radius: 4px; font-size: 1.5rem; font-weight: 600; }
        .bot small { display: block; font: .72rem system-ui, sans-serif; color: var(--muted); font-weight: 400; margin-top: 2px; }
    </style>
</head>
<body style="display: flex;  flex-direction: column;  height: 100vh;">
    <header style="display: flex; flex-direction: column; align-items: center;">
        <h3 style="text-align: center; margin: 0;">One Word LLM</h3>
        <!-- <fieldset role="group" style="width: 10rem; display: flex; flex-direction: column; margin: 1rem;">
        <p>Model Size:</p>
        <select name="model size" id="modelSize">
            <option value=0>Small</option>
            <option value=1>Medium</option>
            <option value=2>Large</option>
        </select>
        </fieldset> -->
    </header>
    <main class="container" style="flex-grow: 1; display: flex;  flex-direction: column;">
        <div id="log">
            <div id="empty" style="text-align: center;">Please wait... Model Loading...</div>
        </div>
        <div id="inputBox">
            <fieldset role="group">
                <input type="text" name="inp" id="inp" placeholder="Ask something..." autocomplete="off">
                <button type="button" id="submitButton">↑</button>
            </fieldset>
        </div>
    </main>
    <script type="module" src="script.js"></script>
</body>
</html>
